spring.application.name=backend-plataforma-juan-palma
server.port=${PORT:8080}

# Por defecto usa H2 (archivo en disco) para desarrollo local.
# Para SQL Server/Azure SQL usa SPRING_PROFILES_ACTIVE=sqlserver
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,https://renovacionpopularsurco.com.pe,https://www.renovacionpopularsurco.com.pe}
app.admin.api-key=${ADMIN_API_KEY:cambiar-esta-clave}

app.uploads.dir=${UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
