spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

# Si Hibernate falla creando/actualizando alguna tabla (ej. por permisos
# insuficientes del usuario de la base de datos, o un conflicto de llaves
# foráneas), esto hace que el arranque falle con un error visible en los
# logs, en vez de quedar en silencio con una tabla creada a medias.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# Ejemplo de DB_URL:
# jdbc:sqlserver://localhost:1433;databaseName=juan_palma;encrypt=true;trustServerCertificate=true
#
# En Azure SQL:
# jdbc:sqlserver://SERVIDOR.database.windows.net:1433;database=juan_palma;encrypt=true;trustServerCertificate=false;loginTimeout=30
