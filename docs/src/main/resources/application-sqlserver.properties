spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

# Ejemplo de DB_URL:
# jdbc:sqlserver://localhost:1433;databaseName=juan_palma;encrypt=true;trustServerCertificate=true
#
# En Azure SQL:
# jdbc:sqlserver://SERVIDOR.database.windows.net:1433;database=juan_palma;encrypt=true;trustServerCertificate=false;loginTimeout=30
