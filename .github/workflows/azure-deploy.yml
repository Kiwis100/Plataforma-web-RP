name: Deploy a Azure App Service (swcap-p-renovacion-frontend-app)

on:
  push:
    branches:
      - develop
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: ${{ vars.AZURE_APP_SERVICE_NAME }}
  WORKING_DIR: docs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.WORKING_DIR }}/pom.xml

      - name: Compilar
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn -B clean package -DskipTests

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ${{ env.WORKING_DIR }}/target/backend-plataforma.jar

      - name: Verificar DNS de Azure
        run: |
          echo "App Service: ${{ env.APP_NAME }}"
          echo "Dominio: ${{ env.APP_NAME }}.azurewebsites.net"
          echo "Resolviendo dominio..."
          getent hosts "${{ env.APP_NAME }}.azurewebsites.net" || true

      - name: Verificar que el sitio responde
        run: |
          echo "Esperando a que la app arranque..."

          for i in {1..12}; do
            echo "Intento $i de 12..."

            if curl -f --connect-timeout 10 --max-time 30 \
              "https://${{ env.APP_NAME }}.azurewebsites.net/actuator/health"; then
              echo "La aplicación está funcionando correctamente."
              exit 0
            fi

            echo "La aplicación todavía no responde. Esperando 10 segundos..."
            sleep 10
          done

          echo "La aplicación no respondió después de varios intentos."
          exit 1
