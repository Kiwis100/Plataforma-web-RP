name: Deploy Frontend a GitHub Pages

# Se ejecuta automáticamente cada vez que se sube (push) código a la rama
# "develop" que afecte la carpeta docs/ (única rama que se usa en este proyecto).
on:
  push:
    branches:
      - develop
    paths:
      - "docs/**"
      - "!docs/src/**"
      - "!docs/pom.xml"
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña "Actions"

# Permisos necesarios para que la Action pueda escribir en el repositorio
# (crear/actualizar la rama gh-pages) y publicar en GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Publicar solo el frontend estático en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          exclude_assets: "src,pom.xml,.env.example,README.md"
          publish_branch: gh-pages
